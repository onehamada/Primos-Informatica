<!-- Conteúdo Principal: Formulário de Login -->
<main style="min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding-top: 20px;">
  <div class="auth-container" style="background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); padding: 40px; width: 100%; max-width: 400px; text-align: center; margin-top: 140px;">
    <img src="images/logo.png" alt="Primos Informática" style="width: 80px; height: 80px; margin-bottom: 20px;">
    <h1 id="authTitle" style="color: #333; font-size: 24px; margin-bottom: 10px;">Primos Informática</h1>
    <p id="authSubtitle" style="color: #666; font-size: 14px; margin-bottom: 30px;">Bem-vindo! Faça login para continuar</p>

    <!-- Formulário de Login -->
    <form id="loginForm" style="display: block;">
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label for="email" style="display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px;">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com" style="width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: all 0.3s ease;">
        <div class="error-message" id="emailError" style="color: #ef4444; font-size: 12px; margin-top: 5px; display: none;"></div>
      </div>
      
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label for="password" style="display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Senha</label>
        <input type="password" id="password" name="password" required placeholder="•••••••" style="width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: all 0.3s ease;">
        <div class="error-message" id="passwordError" style="color: #ffffff; font-size: 12px; margin-top: 5px; display: none;"></div>
      </div>

      <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 14px;">
        <label class="checkbox" style="display: flex; align-items: center; gap: 8px; color: #666;">
          <input type="checkbox" id="remember">
          <span>Lembrar-me</span>
        </label>
        <a href="#" class="forgot-link" style="color: #3b82f6; text-decoration: none; font-weight: 500;" onclick="showForgotPassword(); return false;">Esqueci minha senha</a>
      </div>

      <button type="submit" id="loginBtn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px;">
        Entrar
      </button>
    </form>

    <!-- Formulário de Cadastro -->
    <form id="cadastroForm" style="display: none;">
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label for="cadNome" style="display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Nome Completo</label>
        <input type="text" id="cadNome" name="cadNome" required placeholder="Seu nome completo" style="width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: all 0.3s ease;">

        <div class="error-message" id="cadEmailError" style="color: #ef4444; font-size: 12px; margin-top: 5px; display: none;"></div>
      </div>
      
      <div class="form-group" style="margin-bottom: 20px; text-align: left;">

      </div>

      <div class="form-group" style="margin-bottom: 20px; text-align: left;">
        <label for="cadConfirmarSenha" style="display: block; color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px;">Confirmar Senha</label>
        <input type="password" id="cadConfirmarSenha" name="cadConfirmarSenha" required placeholder="Confirme sua senha" style="width: 100%; padding: 12px 16px; border: 2px solid #e1e5e9; border-radius: 10px; font-size: 16px; transition: all 0.3s ease;">
        <div class="error-message" id="cadConfirmarSenhaError" style="color: #ef4444; font-size: 12px; margin-top: 5px; display: none;"></div>
      </div>

      <div class="form-group" style="margin-bottom: 25px; text-align: left;">

          <span>Li e aceito os <a href="termos-de-uso.html" style="color: #3b82f6; text-decoration: none;">termos de uso</a> e <a href="politica-privacidade.html" style="color: #3b82f6; text-decoration: none;">política de privacidade</a></span>
        </label>
        <div class="error-message" id="cadTermosError" style="color: #ef4444; font-size: 12px; margin-top: 5px; display: none;"></div>
      </div>

      <button type="submit" id="cadastroBtn" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; margin-bottom: 20px;">
        Cadastrar
      </button>
    </form>

    <div class="auth-footer" style="border-top: 1px solid #e1e5e9; padding-top: 20px; color: #666; font-size: 14px;">
      <p id="authFooterText">Não tem conta? <a href="#" style="color: #3b82f6; text-decoration: none; font-weight: 600;" onclick="toggleAuthMode(); return false;">Cadastre-se</a></p>
    </div>
  </div>
</main>

<!-- Notification -->
<div class="notification" id="notification" style="position: fixed; top: 20px; right: 20px; left: 20px; max-width: 400px; margin: 0 auto; padding: 16px; border-radius: 10px; font-weight: 500; z-index: 1000; display: none;"></div>

<script>
// Sistema de Autenticação Simples
class SimpleAuth {
  constructor() {
    this.init();
  }

  init() {
    console.log('🚀 Auth System iniciado');
    
    // Verificar se já está logado
    if (this.isLoggedIn()) {
      this.redirectToHome();
      return;
    }

    // Criar usuário teste se não existir
    this.createTestUser();
    
    // Configurar form
    this.setupForm();
  }

  getUsers() {
    const users = localStorage.getItem('usuarios');
    return users ? JSON.parse(users) : [];
  }

  saveUsers(users) {
    localStorage.setItem('usuarios', JSON.stringify(users));
  }

  getLoggedInUser() {
    const user = localStorage.getItem('usuarioLogado');
    return user ? JSON.parse(user) : null;
  }

  setLoggedInUser(user) {
    localStorage.setItem('usuarioLogado', JSON.stringify(user));
  }

  isLoggedIn() {
    return !!this.getLoggedInUser();
  }

  createTestUser() {
    // Limpar todas as contas existentes
    localStorage.removeItem('usuarios');
    
    // Criar apenas o usuário teste
    const testUser = {
      id: Date.now(),
      nome: 'Usuário Teste',
      email: 'teste@primos.com',
      senha: btoa('123456'),
      dataCadastro: new Date().toISOString()
    };
    
    const users = [testUser];
    this.saveUsers(users);
    
    console.log('✅ Apenas usuário teste criado, todas as outras contas removidas');
  }

  findUser(email, password) {
    const users = this.getUsers();
    const encodedPassword = btoa(password);
    return users.find(user => 
      user.email === email.toLowerCase() && 
      user.senha === encodedPassword
    );
  }

  showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    notification.textContent = message;
    notification.style.background = type === 'success' ? '#10b981' : '#ef4444';
    notification.style.color = 'white';
    notification.style.display = 'block';
    
    setTimeout(() => {
      notification.style.display = 'none';
    }, 3000);
  }

  clearErrors() {
    document.querySelectorAll('.error-message').forEach(msg => {
      msg.style.display = 'none';
      msg.textContent = '';
    });
    document.querySelectorAll('input').forEach(input => {
      input.style.borderColor = '#e1e5e9';
    });
  }

  showError(fieldId, message) {
    const input = document.getElementById(fieldId);
    const error = document.getElementById(fieldId + 'Error');
    
    input.style.borderColor = '#ef4444';
    error.textContent = message;
    error.style.display = 'block';
  }

  validateForm(email, password) {
    this.clearErrors();
    
    let isValid = true;
    
    if (!email.trim()) {
      this.showError('email', 'E-mail é obrigatório');
      isValid = false;
    } else if (!email.includes('@') || !email.includes('.')) {
      this.showError('email', 'E-mail inválido');
      isValid = false;
    }
    
    if (!password.trim()) {
      this.showError('password', 'Senha é obrigatória');
      isValid = false;
    }
    
    return isValid;
  }

  async handleLogin(email, password) {
    if (!this.validateForm(email, password)) {
      return false;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const user = this.findUser(email, password);
    
    if (user) {
      this.setLoggedInUser(user);
      this.showNotification(`Bem-vindo(a), ${user.nome}! Você será redirecionado para a página inicial...`, 'success');
      
      setTimeout(() => {
        this.redirectToHome();
      }, 3000);
      
      return true;
    } else {
      this.showError('password', 'E-mail ou senha incorretos');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return false;
    }
  }

  validateCadastro(nome, email, senha, confirmarSenha, termos) {
    this.clearErrors();
    
    let isValid = true;
    
    // Validar nome
    if (!nome.trim()) {
      this.showError('cadNome', 'Nome é obrigatório');
      isValid = false;
    } else if (nome.trim().length < 3) {
      this.showError('cadNome', 'Nome deve ter pelo menos 3 caracteres');
      isValid = false;
    }
    
    // Validar email
    if (!email.trim()) {
      this.showError('cadEmail', 'E-mail é obrigatório');
      isValid = false;
    } else if (!email.includes('@') || !email.includes('.')) {
      this.showError('cadEmail', 'E-mail inválido');
      isValid = false;
    }
    
    // Validar senha
    if (!senha.trim()) {
      this.showError('cadSenha', 'Senha é obrigatória');
      isValid = false;
    } else if (senha.length < 6) {
      this.showError('cadSenha', 'Senha deve ter pelo menos 6 caracteres');
      isValid = false;
    }
    
    // Validar confirmação de senha
    if (!confirmarSenha.trim()) {
      this.showError('cadConfirmarSenha', 'Confirme sua senha');
      isValid = false;
    } else if (senha !== confirmarSenha) {
      this.showError('cadConfirmarSenha', 'As senhas não coincidem');
      isValid = false;
    }
    
    // Validar termos
    if (!termos) {
      this.showError('cadTermos', 'Você precisa aceitar os termos de uso');
      isValid = false;
    }
    
    return isValid;
  }

  async handleCadastro(nome, email, senha, confirmarSenha, termos) {
    if (!this.validateCadastro(nome, email, senha, confirmarSenha, termos)) {
      return false;
    }

    const btn = document.getElementById('cadastroBtn');
    btn.disabled = true;
    btn.textContent = 'Cadastrando...';

    // Verificar se email já existe
    const users = this.getUsers();
    const emailExists = users.find(user => user.email === email.toLowerCase());
    
    if (emailExists) {
      this.showError('cadEmail', 'Este e-mail já está cadastrado');
      btn.disabled = false;
      btn.textContent = 'Cadastrar';
      return false;
    }

    // Criar novo usuário
    const newUser = {
      id: Date.now(),
      nome: nome.trim(),
      email: email.toLowerCase().trim(),
      senha: btoa(senha),
      dataCadastro: new Date().toISOString()
    };

    users.push(newUser);
    this.saveUsers(users);

    this.showNotification('Cadastro realizado com sucesso! Faça login para continuar.', 'success');
    
    // Limpar formulário
    document.getElementById('cadNome').value = '';
    document.getElementById('cadEmail').value = '';
    document.getElementById('cadSenha').value = '';
    document.getElementById('cadConfirmarSenha').value = '';
    document.getElementById('cadTermos').checked = false;

    // Voltar para login
    setTimeout(() => {
      this.toggleAuthMode();
    }, 2000);

    btn.disabled = false;
    btn.textContent = 'Cadastrar';
    return true;
  }

  toggleAuthMode() {
    const loginForm = document.getElementById('loginForm');
    const cadastroForm = document.getElementById('cadastroForm');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const authFooterText = document.getElementById('authFooterText');

    if (loginForm.style.display === 'none') {
      // Mostrar login
      loginForm.style.display = 'block';
      cadastroForm.style.display = 'none';
      authTitle.textContent = 'Primos Informática';
      authSubtitle.textContent = 'Bem-vindo! Faça login para continuar';
      authFooterText.innerHTML = 'Não tem conta? <a href="#" style="color: #3b82f6; text-decoration: none; font-weight: 600;" onclick="toggleAuthMode(); return false;">Cadastre-se</a>';
    } else {
      // Mostrar cadastro
      loginForm.style.display = 'none';
      cadastroForm.style.display = 'block';
      authTitle.textContent = 'Criar Conta';
      authSubtitle.textContent = 'Preencha os dados abaixo para se cadastrar';
      authFooterText.innerHTML = 'Já tem conta? <a href="#" style="color: #3b82f6; text-decoration: none; font-weight: 600;" onclick="toggleAuthMode(); return false;">Faça login</a>';
    }

    this.clearErrors();
  }

  setupForm() {
    const loginForm = document.getElementById('loginForm');
    const cadastroForm = document.getElementById('cadastroForm');

    // Setup login form
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      await this.handleLogin(email, password);
    });

    // Setup cadastro form
    cadastroForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('cadNome').value;
      const email = document.getElementById('cadEmail').value;
      const senha = document.getElementById('cadSenha').value;
      const confirmarSenha = document.getElementById('cadConfirmarSenha').value;
      const termos = document.getElementById('cadTermos').checked;
      
      await this.handleCadastro(nome, email, senha, confirmarSenha, termos);
    });

    // Limpar erros ao digitar
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => {
        input.style.borderColor = '#e1e5e9';
        const error = document.getElementById(input.id + 'Error');
        if (error) {
          error.style.display = 'none';
        }
      });
    });
  }

  redirectToHome() {
    console.log('🏠 Redirecionando para página inicial...');
    window.location.href = 'index.html';
  }
}

// Funções globais
function showForgotPassword() {
  const message = encodeURIComponent('Ola! Preciso de ajuda para recuperar minha senha no site.');
  window.open(`https://wa.me/556133406740?text=${message}`, '_blank');
}
function showCadastro() {
  // Usar a instância global do SimpleAuth
  if (window.simpleAuth) {
    window.simpleAuth.toggleAuthMode();
  }
}
function toggleAuthMode() {
  // Usar a instância global do SimpleAuth
  if (window.simpleAuth) {
    window.simpleAuth.toggleAuthMode();
  }
}
function limparContas() {
  // Limpar todas as contas e deixar apenas a de teste
  localStorage.removeItem('usuarios');
  
  const testUser = {
    id: Date.now(),
    nome: 'Usuário Teste',
    email: 'teste@primos.com',
    senha: btoa('123456'),
    dataCadastro: new Date().toISOString()
  };
  
  const users = [testUser];
  localStorage.setItem('usuarios', JSON.stringify(users));
  
  console.log('✅ Todas as contas foram removidas. Apenas a conta teste@primos.com foi mantida.');
  alert('Todas as contas foram removidas!\n\nApenas a conta teste@primos.com (senha: 123456) foi mantida.');
}

// Inicializar
document.addEventListener('DOMContentLoaded', function() {
  window.simpleAuth = new SimpleAuth();
