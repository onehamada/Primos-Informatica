<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Autenticação</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Teste de Autenticação - Primos Informática</h1>
    
    <div class="test-section">
        <h2>Status Atual</h2>
        <div id="status"></div>
    </div>
    
    <div class="test-section">
        <h2>Ações de Teste</h2>
        <button onclick="testLocalStorage()">Testar LocalStorage</button>
        <button onclick="createTestUser()">Criar Usuário Teste</button>
        <button onclick="simulateLogin()">Simular Login</button>
        <button onclick="simulateLogout()">Simular Logout</button>
        <button onclick="testRedirect()">Testar Redirecionamento</button>
    </div>
    
    <div class="test-section">
        <h2>Logs</h2>
        <div id="logs"></div>
    </div>

    <script>
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(div);
            console.log(message);
        }

        function updateStatus() {
            const status = document.getElementById('status');
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            
            if (usuarioLogado) {
                try {
                    const usuario = JSON.parse(usuarioLogado);
                    status.innerHTML = `
                        <div class="success">✅ Usuário Logado</div>
                        <div><strong>Nome:</strong> ${usuario.nome}</div>
                        <div><strong>Email:</strong> ${usuario.email}</div>
                        <div><strong>Data:</strong> ${usuario.dataCadastro || 'N/A'}</div>
                    `;
                } catch (e) {
                    status.innerHTML = `<div class="error">❌ Erro ao ler dados: ${e.message}</div>`;
                }
            } else {
                status.innerHTML = `<div class="info">🔓 Nenhum usuário logado</div>`;
            }
        }

        function testLocalStorage() {
            log('Testando LocalStorage...');
            try {
                localStorage.setItem('test', 'value');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                log('✅ LocalStorage funcionando corretamente', 'success');
            } catch (e) {
                log(`❌ Erro no LocalStorage: ${e.message}`, 'error');
            }
        }

        function createTestUser() {
            log('Criando usuário de teste...');
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            const testUser = {
                nome: 'Usuário Teste',
                email: 'teste@exemplo.com',
                senha: btoa('senha123'),
                dataCadastro: new Date().toISOString()
            };
            
            // Verificar se já existe
            if (usuarios.find(u => u.email === testUser.email)) {
                log('⚠️ Usuário de teste já existe', 'info');
            } else {
                usuarios.push(testUser);
                localStorage.setItem('usuarios', JSON.stringify(usuarios));
                log('✅ Usuário de teste criado com sucesso', 'success');
            }
            updateStatus();
        }

        function simulateLogin() {
            log('Simulando login...');
            const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
            const testUser = usuarios.find(u => u.email === 'teste@exemplo.com');
            
            if (testUser) {
                localStorage.setItem('usuarioLogado', JSON.stringify(testUser));
                log('✅ Login simulado com sucesso', 'success');
            } else {
                log('❌ Usuário de teste não encontrado. Crie o usuário primeiro.', 'error');
            }
            updateStatus();
        }

        function simulateLogout() {
            log('Simulando logout...');
            localStorage.removeItem('usuarioLogado');
            log('✅ Logout realizado com sucesso', 'success');
            updateStatus();
        }

        function testRedirect() {
            log('Testando redirecionamento...');
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            
            if (usuarioLogado) {
                log('✅ Usuário está logado, redirecionando para index.html em 2 segundos...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                log('❌ Nenhum usuário logado para redirecionar', 'error');
            }
        }

        // Atualizar status ao carregar
        updateStatus();
        
        // Log inicial
        log('Página de teste carregada com sucesso', 'success');
    </script>
</body>
</html>
