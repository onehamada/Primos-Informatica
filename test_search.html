<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Barra de Pesquisa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .search-container { position: relative; max-width: 400px; margin: 20px 0; }
        .search-input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .search-results { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: white; border: 1px solid #ddd; border-radius: 8px; max-height: 300px; overflow-y: auto; display: none; z-index: 1000; }
        .search-results.active { display: block; }
        .search-result-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .search-result-item:hover { background: #f5f5f5; }
        .search-result-image { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .search-result-info { flex: 1; }
        .search-result-name { font-weight: 500; }
        .search-result-category { font-size: 12px; color: #666; }
        .search-result-price { font-weight: bold; color: #2c5aa0; }
        .search-no-results { padding: 20px; text-align: center; color: #666; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🧪 Teste da Barra de Pesquisa</h1>
    
    <div class="debug">
        <div>Status: <span id="status">Carregando...</span></div>
        <div>Produtos carregados: <span id="productCount">0</span></div>
        <div>Última busca: <span id="lastSearch">Nenhuma</span></div>
    </div>
    
    <div class="search-container">
        <input 
            type="text" 
            class="search-input" 
            id="searchInput"
            placeholder="Buscar produtos..."
            autocomplete="off"
        />
        <div class="search-results" id="searchResults"></div>
    </div>

    <script>
        // Simular produtos de teste
        const testProducts = [
            { codigo: "1006", nome: "MONITOR 19 HAYOM MO6001", categoria: "monitor", precoRaw: 285.00, preco: "R$ 285,00", imagem: "monitor-hayom-19-mo6001.webp" },
            { codigo: "400772", nome: "MONITOR 21.5 PHILIPS FULL HD", categoria: "monitor", precoRaw: 825.00, preco: "R$ 825,00", imagem: "monitor-philips-215-fullhd-221v8.webp" },
            { codigo: "1888", nome: "PROCESSADOR INTEL CELERON G5905", categoria: "processador", precoRaw: 214.99, preco: "R$ 214,99", imagem: "g5905.webp" },
            { codigo: "1828", nome: "PLACA DE VIDEO NVIDIA RTX3060", categoria: "placa de vídeo", precoRaw: 2185.50, preco: "R$ 2.185,50", imagem: "rtx3060.webp" },
            { codigo: "402487", nome: "PLACA DE VIDEO GTX 550", categoria: "placa de vídeo", precoRaw: 303.18, preco: "R$ 303,18", imagem: "gtx550.webp" }
        ];

        // Variáveis globais
        let __searchTimeout = null;
        const searchCache = new Map();
        let currentSearchResults = [];
        let __allProducts = testProducts;

        // Atualizar status
        document.getElementById('status').textContent = '✅ Pronto para testar';
        document.getElementById('productCount').textContent = __allProducts.length;

        // Função formatPrice
        function formatPrice(value) {
            if (typeof value === 'number') return `R$ ${value.toFixed(2).replace('.', ',')}`;
            if (typeof value === 'string') {
                const num = parseFloat(value.replace(',', '.').replace(/[^\d.]/g, ''));
                if (!isNaN(num)) return `R$ ${num.toFixed(2).replace('.', ',')}`;
            }
            return 'R$ 0,00';
        }

        // Função highlightSearchTerm
        function highlightSearchTerm(text, query) {
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span style="background: yellow; font-weight: bold;">$1</span>');
        }

        // Função hideSearchResults
        function hideSearchResults() {
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.classList.remove('active');
                console.log('🔍 Resultados de busca ocultados');
            }
        }

        // Função displaySearchResults
        function displaySearchResults(results, query) {
            const searchResults = document.getElementById('searchResults');
            if (!searchResults) return;
            
            document.getElementById('lastSearch').textContent = query;
            
            if (results.length === 0) {
                searchResults.innerHTML = `
                    <div class="search-no-results">
                        <p>Nenhum produto encontrado para "${query}"</p>
                    </div>
                `;
            } else {
                const fragment = document.createDocumentFragment();
                
                results.forEach(product => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => {
                        alert(`Produto selecionado: ${product.nome} - ${product.preco}`);
                        hideSearchResults();
                        document.getElementById('searchInput').value = '';
                    };
                    
                    item.innerHTML = `
                        <div class="search-result-info">
                            <div class="search-result-name">${highlightSearchTerm(product.nome, query)}</div>
                            <div class="search-result-category">${product.categoria}</div>
                        </div>
                        <div class="search-result-price">${formatPrice(product.precoRaw)}</div>
                    `;
                    
                    fragment.appendChild(item);
                });
                
                searchResults.innerHTML = '';
                searchResults.appendChild(fragment);
            }
            
            searchResults.classList.add('active');
        }

        // Função performSearch
        function performSearch(query) {
            console.log('🔍 Busca iniciada para:', query);
            console.log('📦 Produtos carregados:', __allProducts.length);
            
            if (!query || query.length < 2) {
                hideSearchResults();
                return;
            }
            
            const results = [];
            const normalizedQuery = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            
            for (let i = 0; i < __allProducts.length; i++) {
                const product = __allProducts[i];
                const searchText = [
                    product.nome || '',
                    product.descricao || '',
                    product.marca || '',
                    product.categoria || '',
                    product.codigo || ''
                ].join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                
                if (searchText.includes(normalizedQuery)) {
                    results.push(product);
                }
            }
            
            // Salva no cache
            searchCache.set(query, results);
            
            // Limita cache a 50 entradas
            if (searchCache.size > 50) {
                const firstKey = searchCache.keys().next().value;
                searchCache.delete(firstKey);
            }
            
            currentSearchResults = results;
            displaySearchResults(results, query);
        }

        // Inicialização da busca
        function initSearch() {
            console.log('🔍 Inicializando busca...');
            const searchInput = document.getElementById('searchInput');
            const searchResults = document.getElementById('searchResults');
            console.log('🔍 Elementos encontrados:', { searchInput: !!searchInput, searchResults: !!searchResults });
            
            if (!searchInput || !searchResults) {
                console.error('❌ Elementos de busca não encontrados!');
                return;
            }

            // Debounce para evitar muitas buscas
            searchInput.addEventListener('input', (e) => {
                console.log('🔍 Input detectado:', e.target.value);
                clearTimeout(__searchTimeout);
                __searchTimeout = setTimeout(() => {
                    performSearch(e.target.value.trim());
                }, 300);
            });

            // Fechar busca ao clicar fora
            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    hideSearchResults();
                }
            });

            // Fechar busca com ESC
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideSearchResults();
                    searchInput.blur();
                }
            });
            
            console.log('✅ Busca inicializada com sucesso!');
        }

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', initSearch);
    </script>
</body>
</html>
