<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste CSV - Primos Informática</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .product { border: 1px solid #ddd; margin: 10px 0; padding: 15px; }
        .price { font-size: 1.2em; font-weight: bold; color: #2c5aa0; }
        .debug { background: #f5f5f5; padding: 10px; margin: 5px 0; font-family: monospace; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🧪 Teste de Processamento de Preços - CSV</h1>
    <div id="loading">Carregando CSV...</div>
    <div id="results"></div>

    <script>
        // Função formatPrice idêntica à do site
        function formatPrice(value) {
            if (typeof value === 'number') return `R$ ${value.toFixed(2).replace('.', ',')}`;
            if (typeof value === 'string') {
                const num = parseFloat(value.replace(',', '.').replace(/[^\d.]/g, ''));
                if (!isNaN(num)) return `R$ ${num.toFixed(2).replace('.', ',')}`;
            }
            return 'R$ 0,00';
        }

        // Função parseCsvOptimized idêntica à do site
        function parseCsvOptimized(csvText) {
            try {
                const lines = csvText.split('\n').filter(line => line.trim());
                if (lines.length < 2) {
                    console.error('CSV vazio ou inválido');
                    return [];
                }
                
                const headers = lines[0].split(';').map(h => h.trim());
                console.log('Headers encontrados:', headers);
                
                const products = lines.slice(1, 10).map((line, index) => { // Limitar a 10 para teste
                    const values = line.split(';');
                    const product = {};
                    
                    headers.forEach((header, headerIndex) => {
                        let value = values[headerIndex] || '';
                        value = value.trim();
                        
                        switch(header) {
                            case 'codigo':
                                product.codigo = value;
                                break;
                            case 'nome':
                                product.nome = value;
                                break;
                            case 'categoria':
                                product.categoria = value;
                                break;
                            case 'preco':
                                product.precoRaw = parseFloat(value.replace(',', '.')) || 0;
                                product.preco = formatPrice(product.precoRaw);
                                break;
                            case 'qt':
                                product.qt = parseInt(value) || 0;
                                break;
                            case 'descricao':
                                product.descricao = value;
                                break;
                            case 'marca':
                                product.marca = value;
                                break;
                            case 'promocao':
                                product.promocao = value.toLowerCase() === 'sim';
                                break;
                            case 'imagem':
                                product.imagem = value;
                                break;
                        }
                    });
                    
                    return product;
                }).filter(p => p && p.codigo);
                
                return products;
            } catch (error) {
                console.error('❌ Erro no parsing do CSV:', error);
                return [];
            }
        }

        // Testar carregamento e processamento
        async function testCsvProcessing() {
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            try {
                loading.textContent = 'Carregando CSV...';
                
                const response = await fetch('data/products.csv');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const csvText = await response.text();
                loading.innerHTML = '<span class="success">✅ CSV carregado com sucesso!</span>';
                
                const products = parseCsvOptimized(csvText);
                
                if (products.length === 0) {
                    results.innerHTML = '<div class="error">❌ Nenhum produto encontrado no CSV</div>';
                    return;
                }
                
                results.innerHTML = `<h2>📦 ${products.length} primeiros produtos processados:</h2>`;
                
                products.forEach((product, index) => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    
                    const precoValido = product.precoRaw > 0;
                    const statusClass = precoValido ? 'success' : 'error';
                    const statusIcon = precoValido ? '✅' : '❌';
                    
                    div.innerHTML = `
                        <h3>${statusIcon} Produto ${index + 1}: ${product.nome}</h3>
                        <div class="debug">
                            <strong>Código:</strong> ${product.codigo}<br>
                            <strong>Categoria:</strong> ${product.categoria}<br>
                            <strong>Preço Original (CSV):</strong> ${product.precoRaw || 'NÃO DEFINIDO'}<br>
                            <strong>Tipo do precoRaw:</strong> ${typeof product.precoRaw}<br>
                            <strong>Preço Formatado:</strong> <span class="price">${product.preco}</span><br>
                            <strong>Estoque:</strong> ${product.qt} unidades<br>
                            <strong>Promoção:</strong> ${product.promocao ? 'Sim' : 'Não'}<br>
                            <strong>Status:</strong> <span class="${statusClass}">${precoValido ? 'VÁLIDO' : 'INVÁLIDO'}</span>
                        </div>
                    `;
                    
                    results.appendChild(div);
                });
                
            } catch (error) {
                loading.innerHTML = `<div class="error">❌ Erro: ${error.message}</div>`;
                console.error('Erro completo:', error);
            }
        }

        // Executar teste quando a página carregar
        document.addEventListener('DOMContentLoaded', testCsvProcessing);
    </script>
</body>
</html>
