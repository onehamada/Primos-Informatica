<!-- Modal de Checkout Simples -->
<div class="simple-checkout-overlay" id="simpleCheckoutOverlay">
  <div class="simple-checkout-modal">
    <div class="simple-checkout-header">
      <h3>Finalizar Pedido</h3>
      <button class="simple-checkout-close" onclick="closeSimpleCheckout()">×</button>
    </div>
    
    <div class="simple-checkout-content">
      <div class="simple-order-summary">
        <h4>Resumo do Pedido</h4>
        <div id="simpleCheckoutItems"></div>
        <div class="simple-totals">
          <div class="simple-total-row">
            <span>Subtotal:</span>
            <span id="simpleSubtotal">R$ 0,00</span>
          </div>
          <div class="simple-total-row">
            <span>Entrega:</span>
            <span id="simpleDelivery">R$ 0,00</span>
          </div>
          <div class="simple-total-row simple-total-final">
            <span>Total:</span>
            <span id="simpleTotal">R$ 0,00</span>
          </div>
        </div>
      </div>
      
      <div class="simple-checkout-form">
        <form id="simpleCheckoutForm">
          <div class="simple-form-group">
            <label for="simpleNome">Nome Completo</label>
            <input type="text" id="simpleNome" name="nome" required>
            <span class="simple-error" id="simpleNomeError"></span>
          </div>
          
          <div class="simple-form-group">
            <label for="simpleTelefone">Telefone</label>
            <input type="tel" id="simpleTelefone" name="telefone" required>
            <span class="simple-error" id="simpleTelefoneError"></span>
          </div>
          
          <div class="simple-form-group" id="enderecoGroup">
            <label for="simpleEndereco">Endereço</label>
            <input type="text" id="simpleEndereco" name="endereco" required>
            <span class="simple-error" id="simpleEnderecoError"></span>
          </div>
          
          <div class="simple-delivery-options">
            <h5>Forma de Entrega</h5>
            <label class="simple-delivery-option">
              <input type="radio" name="delivery" value="uber" checked onchange="updatePaymentOptions()">
              <span>Entrega Uber - Taxa por distância</span>
            </label>
            <label class="simple-delivery-option">
              <input type="radio" name="delivery" value="retirada" onchange="updatePaymentOptions()">
              <span>Retirada na Loja - GRÁTIS</span>
            </label>
          </div>
          
          <div class="simple-delivery-calc" id="deliveryCalc" style="display: none;">
            <h6>Calcular Taxa de Entrega</h6>
            <div class="simple-form-group">
              <label for="simpleCep">CEP para cálculo</label>
              <input type="text" id="simpleCep" name="cep" placeholder="00000-000" maxlength="9">
              <button type="button" class="simple-btn-calc" onclick="calculateDeliveryFee()">Calcular</button>
              <span class="simple-error" id="simpleCepError"></span>
            </div>
            <div class="delivery-result" id="deliveryResult" style="display: none;">
              <span class="delivery-distance"></span>
              <span class="delivery-fee"></span>
            </div>
          </div>
          
          <div class="simple-payment-options">
            <h5>Forma de Pagamento</h5>
            <div id="uberPaymentOptions">
              <label class="simple-payment-option">
                <input type="radio" name="payment" value="pix" checked>
                <span>PIX</span>
              </label>
              <label class="simple-payment-option">
                <input type="radio" name="payment" value="transferencia">
                <span>Transferência</span>
              </label>
            </div>
            <div id="retiradaPaymentOptions" style="display: none;">
              <label class="simple-payment-option">
                <input type="radio" name="payment" value="pix-retirada">
                <span>PIX</span>
              </label>
              <label class="simple-payment-option">
                <input type="radio" name="payment" value="transferencia-retirada">
                <span>Transferência</span>
              </label>
              <label class="simple-payment-option">
                <input type="radio" name="payment" value="dinheiro">
                <span>Dinheiro</span>
              </label>
            </div>
          </div>
          
          <div class="simple-checkout-actions">
            <button type="button" class="simple-btn-cancel" onclick="closeSimpleCheckout()">Cancelar</button>
            <button type="submit" class="simple-btn-confirm">Confirmar Pedido</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
