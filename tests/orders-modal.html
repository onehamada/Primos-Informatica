<!-- Modal de Pedidos do Usuário -->
<div class="orders-modal-overlay" id="ordersModalOverlay">
  <div class="orders-modal">
    <div class="orders-modal-header">
      <h3>Meus Pedidos</h3>
      <button class="orders-modal-close" onclick="closeOrdersModal()">×</button>
    </div>
    
    <div class="orders-modal-content">
      <div class="orders-summary">
        <div class="summary-card">
          <h4>📊 Resumo</h4>
          <div class="summary-stats">
            <div class="stat-item">
              <span class="stat-number" id="totalOrders">0</span>
              <span class="stat-label">Pedidos Totais</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="pendingOrders">0</span>
              <span class="stat-label">Pendentes</span>
            </div>
            <div class="stat-item">
              <span class="stat-number" id="completedOrders">0</span>
              <span class="stat-label">Confirmados</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="orders-list">
        <h4>📋 Histórico de Pedidos</h4>
        <div class="orders-filters">
          <button class="filter-btn active" onclick="filterOrders('all')">Todos</button>
          <button class="filter-btn" onclick="filterOrders('pending')">Pendentes</button>
          <button class="filter-btn" onclick="filterOrders('completed')">Confirmados</button>
        </div>
        <div id="ordersList">
          <!-- Pedidos serão carregados aqui -->
        </div>
      </div>
    </div>
  </div>
</div>
